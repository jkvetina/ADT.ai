name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rehearse, e.g. v0.9.6"
        required: true
      dry_run:
        description: "Rehearse every stage without publishing"
        type: boolean
        default: true

# No repository-wide token. Each job below asks for exactly what it needs, so a
# job added later starts with nothing rather than inheriting write access.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: adt-ai
  PYTHON_VERSION: "3.14"

jobs:
  build:
    # Build once. Everything downstream downloads this upload, so no later job
    # can rebuild a different artifact and publish it as the tested one.
    name: build + record (py3.14)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.record.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      dry-run: ${{ steps.resolve.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Resolve the release tag and whether this run publishes
        id: resolve
        run: |
          # The tag goes out as its NAME, never as `refs/tags/<name>`:
          # `gh release view`/`upload` take a tag name and cannot find a ref,
          # while `release_supply_chain.py` accepts either spelling. A tag push
          # is the only trigger that ships a release and `github.ref` is a full
          # ref there, so the unstripped value was the shape every real release
          # ran on and the dispatch rehearsal, which passes a bare name, could
          # never reach.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "dry-run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            ref="${{ github.ref }}"
            echo "tag=${ref#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "dry-run=false" >> "$GITHUB_OUTPUT"
          fi
      # Build tooling is pinned; the runtime dependency floors in
      # pyproject.toml stay deliberately broad. Pinning what builds the wheel
      # makes the artifact reproducible, pinning what the wheel depends on
      # would narrow every user's install.
      - name: Install pinned build tooling
        run: python -m pip install --upgrade "build==1.3.*" "hatchling==1.27.*"
      - name: Build wheel and sdist once
        run: python -m build --wheel --sdist --outdir dist
      - name: Verify wheel and sdist payload parity
        run: python .github/scripts/verify_installed_artifact.py archives --dist dist
      - name: Record the immutable artifact set, checksums and SBOM
        id: record
        run: |
          python .github/scripts/release_supply_chain.py record \
            --dist dist --tag "${{ steps.resolve.outputs.tag }}" \
            --changelog CHANGELOG.md --out-dir release
          python .github/scripts/release_supply_chain.py version \
            --manifest release/release-manifest.json >> "$GITHUB_OUTPUT"
      - name: Attest build provenance for the exact artifact set
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: The attested files are still the recorded files
        run: >-
          python .github/scripts/release_supply_chain.py verify
          --dist dist --manifest release/release-manifest.json --stage attest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adt-ai-release
          path: |
            dist/*
            release/*
          if-no-files-found: error

  assets:
    # The only writer of GitHub Release assets. The local publish contract
    # creates the Release record and its notes and cannot attach files, so an
    # artifact built on a laptop has no route onto a release.
    name: attach release assets
    needs: build
    if: needs.build.outputs.dry-run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: adt-ai-release
      - name: The assets are still the recorded artifact set
        run: >-
          python .github/scripts/release_supply_chain.py verify
          --dist dist --manifest release/release-manifest.json --stage assets
      # The publish contract tags the reviewed merge commit and then creates the
      # Release record carrying the curated notes. The tag push starts this run,
      # so the record can be seconds behind: wait for it rather than creating a
      # second one with notes this job does not own.
      - name: Wait for the Release record the publish contract creates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            if gh release view "${{ needs.build.outputs.tag }}" \
              --repo "${{ github.repository }}" >/dev/null 2>&1; then
              exit 0
            fi
            echo "waiting for release ${{ needs.build.outputs.tag }} (attempt $attempt)"
            sleep 20
          done
          echo "no Release record for ${{ needs.build.outputs.tag }}" >&2
          exit 1
      - name: Attach the built artifacts, checksums, SBOM and ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.build.outputs.tag }}"
          dist/adt_ai-${{ needs.build.outputs.version }}-py3-none-any.whl
          dist/adt_ai-${{ needs.build.outputs.version }}.tar.gz
          release/SHA256SUMS release/adt-ai-sbom.cdx.json
          release/release-manifest.json
          --repo "${{ github.repository }}" --clobber

  publish:
    # Trusted publishing only. No API token exists for this project, so the
    # environment, the workflow filename and the repository below are the whole
    # credential: PyPI checks all three against its Trusted Publisher record.
    name: publish to PyPI
    needs: [build, assets]
    if: needs.build.outputs.dry-run == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/adt-ai
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: adt-ai-release
      - name: What is about to be published is what was attested
        run: >-
          python .github/scripts/release_supply_chain.py verify
          --dist dist --manifest release/release-manifest.json --stage publish
      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          print-hash: true

  downloaded:
    # The claim this whole workflow exists to make: what PyPI serves back is
    # byte-for-byte what CI built, attested and attached.
    name: verify the published artifact
    needs: [build, publish]
    if: needs.build.outputs.dry-run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: adt-ai-release
      - name: Download the published wheel and sdist from PyPI
        run: |
          version="${{ needs.build.outputs.version }}"
          for attempt in $(seq 1 20); do
            if python -m pip download "${PACKAGE_NAME}==${version}" \
              --no-deps --only-binary :all: --dest published; then
              break
            fi
            echo "waiting for PyPI to serve ${version} (attempt $attempt)"
            sleep 30
          done
          python -m pip download "${PACKAGE_NAME}==${version}" \
            --no-deps --no-binary :all: --dest published
      - name: The published artifacts match the release ledger
        run: >-
          python .github/scripts/release_supply_chain.py downloaded
          --manifest release/release-manifest.json --downloaded published

  rehearsal:
    # `workflow_dispatch` with dry_run walks every stage above over the same
    # artifact set and publishes nothing, so the path is proven before a
    # release rather than during one.
    name: rehearse every stage
    needs: build
    if: needs.build.outputs.dry-run != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: adt-ai-release
      - name: Walk record, attest, assets, publish and downloaded
        run: >-
          python .github/scripts/release_supply_chain.py dry-run
          --dist dist --tag "${{ needs.build.outputs.tag }}"
          --changelog CHANGELOG.md --out-dir release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adt-ai-release-rehearsal
          path: release/release-dry-run.md
          if-no-files-found: error
