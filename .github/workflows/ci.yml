name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # The published package ships no test suite (the ~1040 tests live in the
    # private ADT.ai-DEV repo, which gates development). This job is the
    # release-integrity smoke test for the PUBLIC artifact: it proves the
    # released package installs cleanly, imports, and both console entry points
    # resolve and run. It catches the "broken release" class — a dropped file,
    # a bad build, an unimportable package — that DEV's test suite structurally
    # cannot see because DEV never installs the published wheel.
    name: smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package from source
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Import check
        run: python -c "import adt_ai; print('adt_ai', adt_ai.__version__)"
      - name: Console entry points resolve and run
        run: |
          adt --version
          adt --help
          adtai --version

  lint:
    # Blocking: `ruff check src` is clean. PUBLIC ships no tests/ directory, so
    # only src is linted (DEV runs `ruff check src tests`). ruff-format is
    # intentionally NOT run: the code uses deliberate column alignment (see the
    # E221/E241/E251 ignores in pyproject.toml), which `ruff format` would
    # collapse.
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff==0.15.*"
      - name: ruff check
        run: ruff check src
