[build-system]
# Upper-bounded on purpose. The backend is what turns this tree into the file a
# user installs, so a major version arriving on its own would build a different
# artifact from an unchanged tree, and nothing in the diff would say so.
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "adt-ai"
# The version is NOT written here. `src/adt_ai/__init__.py` declares it and
# Hatch reads it from there (see [tool.hatch.version] below). Two files
# carrying the same number are two files that can disagree, and these two did
# until a test was added to catch it; deriving it removes the state the test
# was watching, and the public builder now stamps one file instead of two.
dynamic = ["version"]
description = "Modern Python rewrite of ADT focused on YAML-configured Oracle/APEX deployment tooling."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.14"
# The handle, not a mailbox: an address in packaging metadata is published to
# PyPI, mirrored by every index that scrapes it, and cannot be withdrawn.
authors = [{name = "Jan Kvetina"}]
maintainers = [{name = "Jan Kvetina"}]
# These double as the GitHub repository topics, so they obey the stricter of
# the two rulesets: lowercase, digits and hyphens only, at most 20 entries.
# `.github/repository-settings.yml` is what carries them to the live
# repositories, and a contract test holds the two lists together.
keywords = [
    "apex",
    "cli",
    "database",
    "deployment",
    "devops",
    "oracle",
    "oracle-apex",
    "plsql",
    "sql",
    "sqlcl",
]
# No `Typing :: Typed`, and no `py.typed` beside it. That pair is a promise to
# a consumer's type checker that every public symbol is annotated and checked;
# the typing gate covers Doctor, part of `shared` and new modules, which is
# real and is not that promise.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "chime>=0.7",
    "cryptography>=42",
    "oracledb>=2.2",
    # Windows only, and only ever loaded by a `sqlcl_only` project. The driven
    # SQLcl session needs a terminal, because the JVM block-buffers stdout when
    # it is not talking to one, and a plain pipe there is silent rather than slow
    # (measured 2026-08-21: 90 seconds, no prompt, no answer). POSIX has `pty` in
    # the standard library and Windows has nothing, so this is the ConPTY half.
    # The marker keeps it off every Mac and Linux install (ADT #449).
    "pywinpty>=2.0; sys_platform == 'win32'",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
]

[project.urls]
# Every link names the PUBLIC repository, which is the tree a reader can open.
# `Articles` is also what fills the GitHub repository homepage field, because
# a repository whose homepage is its own URL tells a visitor nothing.
Homepage = "https://github.com/jkvetina/ADT.ai"
Documentation = "https://github.com/jkvetina/ADT.ai/blob/main/docs/README.md"
Changelog = "https://github.com/jkvetina/ADT.ai/blob/main/CHANGELOG.md"
Issues = "https://github.com/jkvetina/ADT.ai/issues"
Articles = "https://www.oneoracledeveloper.com/search/label/project_adt"

[project.scripts]
adt = "adt_ai.cli:console_main"
adtai = "adt_ai.cli:console_main"

[tool.hatch.version]
# The one place the released number lives. Everything else derives from it.
path = "src/adt_ai/__init__.py"

[tool.hatch.build.targets.wheel.force-include]
".gitignore" = "adt_ai/doctor/resources/.gitignore"
"requirements.txt" = "adt_ai/doctor/resources/requirements.txt"
"config/patch_template" = "adt_ai/doctor/resources/config/patch_template"

[tool.hatch.build.targets.sdist]
# An sdist is the source a user builds the wheel from, not a mirror of the
# repository. Hatch ships every tracked file by default, which put 70 MB of
# documentation artwork into a 721 KB package (v0.9.6's sdist weighed 70.6 MB)
# and would ship the private suite from a checkout that carries one. The
# README links its pictures by absolute URL, so nothing the sdist installs or
# renders needs them; the CI workflows, the test suite, and the release notes
# describe the repository rather than the package. The private folders that a
# checkout never carries are listed too: the build copies by allowlist, and
# this is the second line behind it, in the file the build backend reads.
exclude = [
    "/.github",
    "/.pytest_cache",
    "/docs/images",
    "/htmlcov",
    "/images",
    "/TEST_SCENARIOS",
    "/test_scenarios",
    "/tests",
    "/USER_STORIES",
    "/user_stories",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E203",  # aligned annotations use whitespace before ':'
    "E221",  # aligned assignments use multiple spaces before operators
    "E241",  # aligned assignments use multiple spaces after operators
    "E251",  # aligned keyword arguments use spaces around '='
]

[tool.ruff.lint.per-file-ignores]
# These are deliberate re-export hubs for the CLI layer: they import the public
# symbols and re-export them through a dynamic __all__ built from globals(),
# which ruff cannot resolve statically. Every re-export therefore reads as an
# unused import even though the sibling command modules import these names from
# here. Suppress F401/I001 for these generated public aggregators.
#
# Keep these keys in step with the files: they are paths, so a move silently
# orphans the ignore and `ruff --fix` then deletes the whole re-export block.
"src/adt_ai/cli/constants.py" = ["F401", "I001"]
"src/adt_ai/cli/__init__.py"  = ["F401", "I001"]
[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
show_error_codes = true
# The whole package, since #670. The boundary was Doctor plus five shared
# files while the rest of the tree carried typing debt; by the 1.0 audit the
# other 320 files passed strict mypy unchanged, and a gate that read 13 of them
# let a regression in the other 320 land with no signal.
files = ["src/adt_ai"]

# The runtime dependencies, which the type venv does not install: it carries the
# checker and `types-PyYAML` and nothing else, so every one of these resolves to
# "cannot find implementation or library stub" rather than to a signature. The
# entry says the import is a third-party boundary, which is the honest shape --
# and it is scoped per distribution rather than set globally, so a first-party
# module that fails to resolve still fails the gate. `types-PyYAML` is
# deliberately absent from the list: `yaml` HAS stubs here and must keep being
# checked against them.
[[tool.mypy.overrides]]
module = [
    "chime.*",
    "cryptography.*",
    "oracledb.*",
    "ruamel.*",
    "winpty.*",
]
ignore_missing_imports = true
# Public build strips private history commands, leaving this generated
# aggregator with imports that are intentionally not normalized by ruff.
"src/adt_ai/cli/commands_history.py" = ["F401", "I001"]
