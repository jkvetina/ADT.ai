[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "adt-ai"
version = "0.6.2"
description = "Modern Python rewrite of ADT focused on YAML-configured Oracle/APEX deployment tooling."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "chime>=0.7",
    "cryptography>=42",
    "oracledb>=2.2",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
]

[project.scripts]
adt = "adt_ai.cli:console_main"
adtai = "adt_ai.cli:console_main"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E203",  # aligned annotations use whitespace before ':'
    "E221",  # aligned assignments use multiple spaces before operators
    "E241",  # aligned assignments use multiple spaces after operators
    "E251",  # aligned keyword arguments use spaces around '='
]

[tool.ruff.lint.per-file-ignores]
# cli_constants is a deliberate re-export hub for the CLI layer: it imports the
# public symbols and re-exports them through a dynamic __all__ built from
# globals(), which ruff cannot resolve statically. Every re-export therefore
# reads as an unused import even though the cli_* command modules import these
# names from here. Suppress F401/I001 for this generated public aggregator.
"src/adt_ai/cli_constants.py" = ["F401", "I001"]
# Public build strips private history commands, leaving this generated
# aggregator with imports that are intentionally not normalized by ruff.
"src/adt_ai/cli_commands_history.py" = ["F401", "I001"]
