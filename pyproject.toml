[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "adt-ai"
version = "0.5.3"
description = "Modern Python rewrite of ADT focused on YAML-configured Oracle/APEX deployment tooling."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "chime>=0.7",
    "oracledb>=2.2",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
]

[project.scripts]
adt = "adt_ai.cli:console_main"
adtai = "adt_ai.cli:console_main"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E203",  # aligned annotations use whitespace before ':'
    "E221",  # aligned assignments use multiple spaces before operators
    "E241",  # aligned assignments use multiple spaces after operators
    "E251",  # aligned keyword arguments use spaces around '='
]

[tool.ruff.lint.per-file-ignores]
# cli_constants is a deliberate re-export hub for the CLI layer: it imports the
# public symbols and re-exports them through a dynamic __all__ built from
# globals(), which ruff cannot resolve statically. Every re-export therefore
# reads as an unused import even though the cli_* command modules import these
# names from here. Suppress F401 for this aggregator only.
"src/adt_ai/cli_constants.py" = ["F401"]
# cli_commands_history builds the same dynamic __all__ from globals() (see its
# final line), so its imported command symbols read as unused to ruff even
# though they are intentionally re-exported. Suppress F401 here for that reason.
"src/adt_ai/cli_commands_history.py" = ["F401"]
